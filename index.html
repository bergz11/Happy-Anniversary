<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 7th Anniversary ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(-45deg,#ff4b91,#ff6ec7,#ff99cc,#ff5fa2);
    background-size:400% 400%;
    animation:gradient 10s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    text-align:center;
    color:white;
    z-index:10;
}

.glass{
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.2);
    padding:30px;
    border-radius:25px;
    width:90%;
    max-width:600px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    font-size:2.5rem;
    margin-bottom:15px;
}

p{
    font-size:1.2rem;
    line-height:1.7;
}

button{
    margin-top:20px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    background:white;
    color:#ff4081;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

#message{
    display:none;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

.heart{
    position:absolute;
    color:white;
    animation:floatUp linear infinite;
    opacity:.8;
}

@keyframes floatUp{
    from{
        transform:translateY(100vh) scale(0.5);
    }
    to{
        transform:translateY(-100px) scale(1.5);
    }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">
    <div class="glass">

        <div id="intro">
            <h1>❤️ Happy Anniversary ❤️</h1>
            <p>7 years of love, memories, laughter and dreams.</p>
            <button onclick="startSurprise()">
                Open Surprise ❤️
            </button>
        </div>

        <div id="message">
            <h1>Happy 7th Anniversary ❤️</h1>

            <p id="typewriter"></p>
        </div>

    </div>
</div>

<script>

function createHearts(){
    setInterval(()=>{
        let heart=document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML="❤️";

        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(Math.random()*20+15)+"px";
        heart.style.animationDuration=(Math.random()*5+5)+"s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },10000);

    },300);
}
createHearts();

function startSurprise(){

    document.getElementById("intro").style.display="none";
    document.getElementById("message").style.display="block";

    heartExplosion();
    startTypewriter();
    startFireworks();
}

function heartExplosion(){

    for(let i=0;i<80;i++){

        let heart=document.createElement("div");
        heart.innerHTML="❤️";
        heart.style.position="absolute";
        heart.style.left="50%";
        heart.style.top="50%";
        heart.style.fontSize="25px";

        let angle=Math.random()*360;
        let distance=Math.random()*400;

        heart.style.transition="2s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.style.transform=
            `translate(
            ${Math.cos(angle)*distance}px,
            ${Math.sin(angle)*distance}px
            )`;
            heart.style.opacity="0";
        },10);

        setTimeout(()=>{
            heart.remove();
        },2000);
    }
}

function startTypewriter(){

const text=
`Thank you for the most beautiful 7 years of my life.

Every smile, every challenge, every memory became special because of you.

No matter what happens, I will always choose you.

I love you today, tomorrow, and forever. ❤️`;

let i=0;

function typing(){

    if(i<text.length){
        document.getElementById("typewriter").innerHTML+=text.charAt(i);
        i++;
        setTimeout(typing,40);
    }
}
typing();
}

/* FIREWORKS */

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function createFirework(){

    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height/2;

    for(let i=0;i<80;i++){

        particles.push({
            x:x,
            y:y,
            radius:2,
            speedX:(Math.random()-0.5)*8,
            speedY:(Math.random()-0.5)*8,
            alpha:1
        });
    }
}

function animateFireworks(){

    requestAnimationFrame(animateFireworks);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,index)=>{

        p.x+=p.speedX;
        p.y+=p.speedY;
        p.alpha-=0.01;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,255,255,${p.alpha})`;
        ctx.fill();

        if(p.alpha<=0){
            particles.splice(index,1);
        }
    });
}

animateFireworks();

function startFireworks(){

    setInterval(()=>{
        createFirework();
    },1000);
}

window.addEventListener('resize',()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});

</script>

</body>
</html>
